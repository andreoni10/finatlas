{% extends 'base.html' %}

{% block title %}
  Login — FinAtlas
{% endblock %}

{% block content %}
  <div class="max-w-sm mx-auto mt-16 bg-white rounded-xl shadow p-8">
    <h1 class="text-xl font-semibold mb-6">Entrar no FinAtlas</h1>

    {% if form.errors %}
      <p class="text-sm text-red-600 mb-4">Usuário ou senha inválidos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" for="id_username">Usuário</label>
        {{ form.username }}
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium mb-1" for="id_password">Senha</label>
        {{ form.password }}
      </div>
      <button type="submit" class="w-full bg-slate-900 text-white rounded-md py-2 font-medium hover:bg-slate-800">Entrar</button>
    </form>
  </div>
{% endblock %}
