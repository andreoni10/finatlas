{% extends 'base.html' %}
{% block title %}
  Painel Financeiro — FinAtlas
{% endblock %}
{% block content %}
  <h1 class="text-2xl font-semibold mb-6">Painel do Financeiro</h1>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg">
    <a href="{% url 'company_list' %}" class="bg-white rounded-lg shadow p-5 hover:shadow-md">
      <span class="block font-medium">Empresas</span>
      <span class="text-sm text-slate-500">PJ1, PJ2, Plus</span>
    </a>
    <a href="{% url 'product_list' %}" class="bg-white rounded-lg shadow p-5 hover:shadow-md">
      <span class="block font-medium">Produtos</span>
      <span class="text-sm text-slate-500">Cadastrados por empresa</span>
    </a>
    <a href="{% url 'advisor_list' %}" class="bg-white rounded-lg shadow p-5 hover:shadow-md">
      <span class="block font-medium">Assessores</span>
      <span class="text-sm text-slate-500">Cadastro e acesso</span>
    </a>
    <a href="{% url 'commission_list' %}" class="bg-white rounded-lg shadow p-5 hover:shadow-md">
      <span class="block font-medium">Comissões</span>
      <span class="text-sm text-slate-500">Percentual por período</span>
    </a>
  </div>
{% endblock %}
